resolver 127.0.0.11 valid=10s ipv6=off;
upstream dify_api {
    zone dify_api 64k;
    server api:5001 resolve;
}
upstream dify_web {
    zone dify_web 64k;
    server web:3000 resolve;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    location /console/api { proxy_pass http://dify_api; }
    location /api { proxy_pass http://dify_api; }
    location /v1 { proxy_pass http://dify_api; }
    location /files { proxy_pass http://dify_api; }
    location /mcp { proxy_pass http://dify_api; }
    location / { proxy_pass http://dify_web; }
}
